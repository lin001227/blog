<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>风屿 · 随笔</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', 'Noto Serif SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* ============ CSS Variables (Light) ============ */
    :root {
      --bg-page: #fafaf9;
      --bg-card: #ffffff;
      --bg-nav: rgba(250, 250, 249, 0.92);
      --bg-tag: #f5f5f4;
      --bg-pinned: #eff6ff;
      --bg-pre: #f5f5f4;
      --bg-code: #f5f5f4;
      --bg-newsletter: #ffffff;
      --bg-input: #ffffff;

      --border: #e7e5e4;
      --border-input: #d6d3d1;
      --border-blockquote: #d6d3d1;

      --text-primary: #1c1917;
      --text-secondary: #78716c;
      --text-muted: #a8a29e;
      --text-body: #292524;
      --text-accent: #2563eb;
      --text-accent-hover: #1d4ed8;

      --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.04);
      --shadow-card-hover: 0 4px 12px rgba(0, 0, 0, 0.06);
      --shadow-btn: none;

      --nav-height: 60px;
      --max-width: 1100px;
    }

    /* ============ CSS Variables (Dark) ============ */
    .dark {
      --bg-page: #0c0a09;
      --bg-card: #1c1917;
      --bg-nav: rgba(12, 10, 9, 0.95);
      --bg-tag: #292524;
      --bg-pinned: #1e3a5f;
      --bg-pre: #292524;
      --bg-code: #292524;
      --bg-newsletter: #1c1917;
      --bg-input: #292524;

      --border: #292524;
      --border-input: #44403c;
      --border-blockquote: #44403c;

      --text-primary: #fafaf9;
      --text-secondary: #a8a29e;
      --text-muted: #78716c;
      --text-body: #d6d3d1;
      --text-accent: #60a5fa;
      --text-accent-hover: #93c5fd;

      --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.3);
      --shadow-card-hover: 0 4px 12px rgba(0, 0, 0, 0.5);
      --shadow-btn: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    /* Prevent flash of wrong theme */
    .dark body {
      background: #0c0a09;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
