<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta Tags -->
  <title>风屿 · 随笔</title>
  <meta name="title" content="风屿 · 随笔" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://localhost/" />
  <meta property="og:title" content="风屿 · 随笔" />
  <meta property="og:description" content="记录思考，分享见解，在文字中找到宁静。个人博客，涵盖技术、生活与思考。" />
  <meta property="og:image" content="/favicon.svg" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary" />
  <meta property="twitter:url" content="https://localhost/" />
  <meta property="twitter:title" content="风屿 · 随笔" />
  <meta property="twitter:description" content="记录思考，分享见解，在文字中找到宁静。个人博客，涵盖技术、生活与思考。" />

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="风屿 · 随笔 RSS Feed" href="/api/rss" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', 'Noto Serif SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* ============ CSS Variables (Light) ============ */
    :root {
      --bg-page: #fafaf9;
      --el-card-border-radius: 10px;
      --bg-card: #ffffff;
      --bg-nav: rgba(250, 250, 249, 0.92);
      --bg-tag: #f5f5f4;
      --bg-pinned: #eff6ff;
      --bg-pre: #f5f5f4;
      --bg-code: #f5f5f4;
      --bg-newsletter: #ffffff;
      --bg-input: #ffffff;
      --bg-toc-hover: #f5f5f4;

      --border: #e7e5e4;
      --border-input: #d6d3d1;
      --border-blockquote: #d6d3d1;

      --text-primary: #1c1917;
      --text-secondary: #78716c;
      --text-muted: #a8a29e;
      --text-body: #292524;
      --text-accent: #2563eb;
      --text-accent-hover: #1d4ed8;

      --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.04);
      --shadow-card-hover: 0 4px 12px rgba(0, 0, 0, 0.06);
      --shadow-btn: none;

      --nav-height: 60px;
      --max-width: 1100px;

      --el-skeleton-color: #f5f5f4;
      --el-skeleton-to-color: #e7e5e4;
    }

    /* ============ CSS Variables (Dark) ============ */
    .dark {
      --bg-page: #0c0a09;
      --bg-card: #1c1917;
      --bg-nav: rgba(12, 10, 9, 0.95);
      --bg-tag: #292524;
      --bg-pinned: #1e3a5f;
      --bg-pre: #292524;
      --bg-code: #292524;
      --bg-newsletter: #1c1917;
      --bg-input: #292524;
      --bg-toc-hover: #292524;

      --border: #292524;
      --border-input: #44403c;
      --border-blockquote: #44403c;

      --text-primary: #fafaf9;
      --text-secondary: #a8a29e;
      --text-muted: #78716c;
      --text-body: #d6d3d1;
      --text-accent: #60a5fa;
      --text-accent-hover: #93c5fd;

      --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.3);
      --shadow-card-hover: 0 4px 12px rgba(0, 0, 0, 0.5);
      --shadow-btn: 0 1px 2px rgba(0, 0, 0, 0.3);

      --el-skeleton-color: #292524;
      --el-skeleton-to-color: #44403c;
    }

    /* ============ Element Plus Dark Mode ============ */
    html.dark {
      --el-color-primary: #60a5fa;
      --el-card-border-radius: 10px;
      --el-color-primary-dark-2: #93c5fd;
      --el-color-primary-light-3: #3b5d8c;
      --el-color-primary-light-5: #2a4570;
      --el-color-primary-light-7: #1a2d4f;
      --el-color-primary-light-8: #13223d;
      --el-color-primary-light-9: #0c172b;
      --el-color-success: #67c23a;
      --el-color-warning: #e6a23c;
      --el-color-danger: #f56c6c;
      --el-color-error: #f56c6c;
      --el-color-info: #78716c;

      --el-bg-color-page: #0c0a09;
      --el-bg-color: #1c1917;
      --el-bg-color-overlay: #292524;

      --el-text-color-primary: #fafaf9;
      --el-text-color-regular: #e7e5e4;
      --el-text-color-secondary: #a8a29e;
      --el-text-color-placeholder: #78716c;
      --el-text-color-disabled: #57534e;

      --el-border-color-darker: #57534e;
      --el-border-color-dark: #44403c;
      --el-border-color: #292524;
      --el-border-color-light: #292524;
      --el-border-color-lighter: #1c1917;
      --el-border-color-extra-light: #1c1917;

      --el-fill-color-darker: #292524;
      --el-fill-color-dark: #292524;
      --el-fill-color: #292524;
      --el-fill-color-light: #292524;
      --el-fill-color-lighter: #1c1917;
      --el-fill-color-extra-light: #1c1917;
      --el-fill-color-blank: #1c1917;

      --el-mask-color: rgba(0, 0, 0, 0.6);
      --el-mask-color-extra-light: rgba(0, 0, 0, 0.3);

      --el-box-shadow: 0px 12px 32px 4px rgba(0, 0, 0, 0.36), 0px 8px 20px rgba(0, 0, 0, 0.72);
      --el-box-shadow-light: 0px 0px 12px rgba(0, 0, 0, 0.72);
      --el-box-shadow-lighter: 0px 0px 6px rgba(0, 0, 0, 0.72);
      --el-box-shadow-dark: 0px 16px 48px 16px rgba(0, 0, 0, 0.72), 0px 12px 32px #000, 0px 8px 16px -8px #000;

      --el-card-bg-color: #1c1917;
      --el-tag-bg-color: #292524;
      --el-tag-text-color: #a8a29e;
      --el-tag-border-color: #44403c;
      --el-input-bg-color: #292524;
      --el-input-text-color: #fafaf9;
      --el-input-border-color: #44403c;
      --el-input-hover-border-color: #60a5fa;
      --el-input-focus-border-color: #60a5fa;
      --el-button-disabled-text-color: rgba(168, 162, 158, 0.5);
      --el-table-bg-color: #1c1917;
      --el-table-tr-bg-color: #1c1917;
      --el-table-header-bg-color: #292524;
      --el-table-row-hover-bg-color: #292524;
      --el-table-border-color: #292524;
      --el-table-header-text-color: #a8a29e;
      --el-table-text-color: #e7e5e4;
      --el-pagination-bg-color: transparent;
      --el-pagination-button-bg-color: transparent;
      --el-pagination-button-hover-bg-color: #292524;
      --el-dialog-bg-color: #1c1917;
      --el-dialog-box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      --el-popover-bg-color: #292524;
      --el-message-bg-color: #292524;
      --el-message-border-color: #44403c;
      --el-empty-fill-color-1: #292524;
      --el-empty-fill-color-2: #292524;
    }

    /* Prevent flash of wrong theme */
    .dark body {
      background: #0c0a09;
    }

    /* Smooth theme transitions */
    html.theme-transitioning,
    html.theme-transitioning *,
    html.theme-transitioning *::before,
    html.theme-transitioning *::after {
      transition: all 0.45s ease !important;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
